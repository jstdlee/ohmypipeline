name: build

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.triple }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            artifact: false
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            artifact: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev python3 python3-venv python3-pip
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Pandas worker
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r worker/requirements.txt
          PYTHONPATH=worker .venv/bin/python -m unittest worker.tests.test_pipeline
      - name: Release binary
        run: cargo build --release -p ompp
      - name: Upload aarch64 binary
        if: matrix.artifact
        uses: actions/upload-artifact@v4
        with:
          name: ompp-aarch64-unknown-linux-gnu
          path: target/release/ompp
